<text x="100" y="40" font-size="22" font-weight="700" fill="#0b0b0b">E1 — 응답 후 차감과 고정 구간: 한도 20,000토큰 / 15초, 장문 요청(약 12,100토큰) 연속</text>
<text x="100" y="68" font-size="15" fill="#52514e">구간은 슬라이딩이 아니라 고정 구간이다. 그 사용자의 첫 차감 시점에 시작해 15초 뒤 카운터가 0으로 한꺼번에 초기화된다.</text>
<text x="100" y="90" font-size="15" fill="#52514e">요청 시작 시에는 "누적 &lt; 한도"만 확인하고(통과), 토큰은 응답이 끝날 때 차감된다.</text>
