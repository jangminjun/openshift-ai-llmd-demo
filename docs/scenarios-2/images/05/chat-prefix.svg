<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" font-family="Apple SD Gothic Neo, AppleGothic, Noto Sans KR, Helvetica, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker></defs>
<rect width="1100" height="480" fill="#fcfcfb"/>
<text x="40" y="36" font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="700">채팅에서 앞의 대화는 다음 질문의 prefix가 된다</text>
<text x="40" y="60" font-size="14" fill="#52514e" text-anchor="start">매 질문마다 지금까지의 대화 전체를 다시 보낸다. 앞부분은 이미 계산한 것이므로 KV 캐시를 재사용할 수 있다.</text>
<text x="40" y="133" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700">1번째 질문</text>
<rect x="170" y="100" width="540.0" height="54" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="440.0" y="124" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">문서</text>
<text x="440.0" y="143" font-size="12" fill="#ffffff" text-anchor="middle">약 3,000토큰</text>
<rect x="714.0" y="100" width="54.0" height="54" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="741.0" y="124" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">질문1</text>
<text x="741.0" y="143" font-size="12" fill="#ffffff" text-anchor="middle"></text>
<text x="782.0" y="133" font-size="14" fill="#2a78d6" text-anchor="start" font-weight="700">→ 전부 새로 계산</text>
<text x="40" y="233" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700">2번째 질문</text>
<rect x="170" y="200" width="540.0" height="54" rx="6" fill="#e4e3dd" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="440.0" y="224" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700">문서</text>
<text x="440.0" y="243" font-size="12" fill="#52514e" text-anchor="middle">1번째에 계산함</text>
<rect x="714.0" y="200" width="54.0" height="54" rx="6" fill="#e4e3dd" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="741.0" y="224" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700">질문1</text>
<text x="741.0" y="243" font-size="12" fill="#52514e" text-anchor="middle"></text>
<rect x="772.0" y="200" width="59.4" height="54" rx="6" fill="#e4e3dd" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="801.7" y="224" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700">응답1</text>
<text x="801.7" y="243" font-size="12" fill="#52514e" text-anchor="middle"></text>
<rect x="835.4" y="200" width="54.0" height="54" rx="6" fill="#d9822b" stroke="#d9822b" stroke-width="1.5"/>
<text x="862.4" y="224" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">질문2</text>
<text x="862.4" y="243" font-size="12" fill="#ffffff" text-anchor="middle"></text>
<text x="903.4" y="225" font-size="14" fill="#d9822b" text-anchor="start" font-weight="700">→ 새로 계산할 부분</text>
<text x="903.4" y="244" font-size="14" fill="#d9822b" text-anchor="start">   약 100토큰</text>
<path d="M170,266 L170,276 L831.4,276 L831.4,266" fill="none" stroke="#52514e" stroke-width="1.5"/>
<text x="500.7" y="298" font-size="14" fill="#52514e" text-anchor="middle">기대: 앞의 대화 전체 = prefix, 캐시에서 재사용</text>
<text x="40" y="365" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700">2번째 질문</text>
<text x="40" y="384" font-size="14" fill="#52514e" text-anchor="start">(실제)</text>
<rect x="170" y="340" width="282.24" height="54" rx="6" fill="#e4e3dd" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="311.12" y="364" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700">블록 1 (1,568토큰)</text>
<text x="311.12" y="383" font-size="12" fill="#52514e" text-anchor="middle">캐시 재사용</text>
<rect x="456.24" y="340" width="433.15999999999997" height="54" rx="6" fill="#d9822b" stroke="#d9822b" stroke-width="1.5"/>
<text x="672.8199999999999" y="364" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">캐시 안 된 꼬리 약 1,540토큰</text>
<text x="672.8199999999999" y="383" font-size="12" fill="#ffffff" text-anchor="middle">문서 뒷부분 + 질문1 + 응답1 + 질문2</text>
<line x1="454.24" y1="330" x2="454.24" y2="404" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="454.24" y="326" font-size="12" fill="#52514e" text-anchor="middle">1,568</text>
<text x="40" y="432" font-size="13" fill="#52514e" text-anchor="start">하이브리드 모델은 KV 블록이 1,568토큰이다. prefix 캐시는 꽉 찬 블록만 재사용하므로, 1번째 질문(약 3,030토큰)에서 캐시되는 것은</text>
<text x="40" y="452" font-size="13" fill="#52514e" text-anchor="start">블록 1개뿐이다. 2번째 질문은 약 50%만 적중하고, 나머지 약 1,540토큰은 다시 계산해야 한다(실측 적중률 decode 50%, prefill 49%).</text>
</svg>