# Support check before P/D: Qwen3.8-27B INT4 (W4A16, FP8 KV) as one TP2 instance on L4 x 2.
# Verifies that the RHOAI vLLM image loads Qwen3_5ForConditionalGeneration + compressed-tensors INT4
# and reports the KV cache size. Node: g6.12xlarge (L4 24GB x 4).
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen38-int4-tp2
  namespace: llmd-pd
  labels:
    opendatahub.io/dashboard: "true"
spec:
  model:
    name: Qwen3.8-27B-INT4
    uri: hf://RedHatAI/Qwen3.8-27B-INT4
  replicas: 1
  parallelism:
    tensor: 2
  router:
    gateway:
      refs:
      - name: maas-default-gateway
        namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    nodeSelector:
      node.kubernetes.io/instance-type: g6.12xlarge
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    containers:
    - name: main
      env:
      - name: VLLM_ADDITIONAL_ARGS
        # Text only: skips the vision-encoder profile (16384-token encoder budget + 1 max-size image),
        # which pushed L4 (22 GiB) into CUDA OOM during startup together with CUDA graph profiling.
        # The template eval's VLLM_ADDITIONAL_ARGS: unquoted JSON loses its quotes (and braces expand),
        # so use the dotted form here and single-quote any JSON value.
        value: >-
          --max-model-len=16384 --gpu-memory-utilization=0.85 --kv-cache-dtype=fp8
          --limit-mm-per-prompt.image=0 --limit-mm-per-prompt.video=0 --max-num-seqs=64
      resources:
        limits:   {cpu: "8", memory: 48Gi, nvidia.com/gpu: "2"}
        requests: {cpu: "8", memory: 48Gi, nvidia.com/gpu: "2"}
